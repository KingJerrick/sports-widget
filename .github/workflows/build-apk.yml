name: Build APK

# 本机没有 Android Studio / JDK / Android SDK，所以打包走这条路：
# 把工程推到 GitHub，这个 workflow 直接产出可安装的 debug APK。
#
# 注意：仓库根目录必须就是本工程根目录（即 settings.gradle.kts 所在那一层）。
# 不要把本目录整个嵌套在别的目录里推上去，否则下面的 APK 产物路径会找不到。
on:
  push:
    branches: [ main, master ]
    # update-calendar 每 6 小时会提交一次 data/calendar.json 和 APK 里的兜底快照，
    # 那条路径不触发打包 —— 否则每 6 小时白跑一次构建。
    # 想让它带上最新数据时，去 Actions 页面手动 Run workflow 就行。
    paths-ignore:
      - 'data/**'
      - 'app/src/main/assets/**'
      # 构建失败时 workflow 自己会提交这个文件，不能让它再触发一轮构建
      # （提交信息里也有 [skip ci]，两道保险）
      - 'build-error.md'
  workflow_dispatch:

# 构建失败时要把错误写进 build-error.md 提交回仓库，所以需要写权限。
# 不声明的话默认 token 是只读的，那一步会静默失败（`git push` 报 403 被 `|| echo` 吞掉），
# 表现就是「失败了但 build-error.md 没出现」——正是这个机制本来要解决的问题。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # continue-on-error 是故意的：构建失败也要往下走，把错误记录下来
      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # ── 构建失败时，把错误写进仓库 ─────────────────────────────────────
      # 这个工程的目标机器上**没有 JDK / Android SDK**，编译只能在 Actions 上跑。
      # 而 Actions 的日志页要登录、日志接口又要管理员权限才能读，
      # 结果就是「构建失败了但看不到为什么」。
      # 所以失败时把关键错误行落进 build-error.md —— 这样任何地方都能用
      # raw 链接读到，不用登录。
      #
      # 提交信息里的 [skip ci] 不能去掉，否则这次提交又会触发一轮构建，
      # 失败的话再写一次文件，就成了死循环。
      - name: Report build failure
        if: steps.build.outcome == 'failure'
        run: |
          {
            echo "# 最近一次构建失败"
            echo
            echo "时间：$(date -u '+%Y-%m-%d %H:%M UTC')  "
            echo "提交：\`$GITHUB_SHA\`"
            echo
            echo '```'
            grep -E "^e: |error:|FAILURE:|What went wrong|Execution failed|Caused by|> Task .* FAILED|\.kt:[0-9]+|\.xml:[0-9]+" build.log | head -80
            echo '```'
          } > build-error.md
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-error.md
          git commit -m "ci: 记录构建失败原因 [skip ci]" || echo "没有变化"
          git push || echo "推送失败，忽略"

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sports-widget-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 把上一步的失败状态带出来，让这次 job 仍然是红的
      - name: Fail the job
        if: steps.build.outcome == 'failure'
        run: exit 1
