name: Build APK

# 本机没有 Android Studio / JDK / Android SDK，所以打包走这条路：
# 把工程推到 GitHub，这个 workflow 直接产出可安装的 debug APK。
#
# 注意：仓库根目录必须就是本工程根目录（即 settings.gradle.kts 所在那一层）。
# 不要把本目录整个嵌套在别的目录里推上去，否则下面的 APK 产物路径会找不到。
on:
  push:
    branches: [ main, master ]
    # update-calendar 每 6 小时会提交一次 data/calendar.json 和 APK 里的兜底快照，
    # 那条路径不触发打包 —— 否则每 6 小时白跑一次构建。
    # 想让它带上最新数据时，去 Actions 页面手动 Run workflow 就行。
    paths-ignore:
      - 'data/**'
      - 'app/src/main/assets/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sports-widget-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
